<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jet Village 2</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0a10;
        color: #eef0f2;
        font-family: ui-sans-serif, system-ui, sans-serif;
        overflow: hidden;
      }
      #app {
        display: grid;
        place-items: center;
        height: 100%;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        width: 100%;
        height: 100%;
        display: block;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 12px;
        font-size: 12px;
        opacity: 0.9;
        pointer-events: none;
        z-index: 2;
        text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="game" width="640" height="360" aria-label="Jet Village 2"></canvas>
    </div>
    <div id="hud">Jet Village 2 · loading…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
